name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships an SDK but neither exports ANDROID_HOME nor puts
      # sdkmanager on PATH, so resolve both explicitly. $GITHUB_PATH only takes
      # effect in *later* steps, hence the local export as well.
      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No Android SDK at $SDK" >&2
            ls -d /usr/local/lib/android/sdk /opt/android-sdk 2>/dev/null || true
            exit 1
          fi
          BIN="$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)")"
          if [ -z "$BIN" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$BIN:$PATH"
          sdkmanager --version

      - name: Accept SDK licences
        # A non-interactive runner has accepted nothing, and an unaccepted
        # licence fails the first install with a message that does not say so.
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          # API 37 ships under the extension-level directory name (android-37.0)
          # while the package is still addressed as android-37 on most channels.
          # Try both rather than hard-coding whichever this repo was built against.
          sdkmanager --install "platform-tools" "build-tools;37.0.0"
          sdkmanager --install "platforms;android-37" \
            || sdkmanager --install "platforms;android-37.0"
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties

      - name: Build, lint and test
        run: ./gradlew build --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
