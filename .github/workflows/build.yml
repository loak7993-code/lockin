name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's runner image ships an SDK but does not put sdkmanager on PATH,
      # so point at it explicitly before trying to use it.
      - name: Put the Android SDK on PATH
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          # API 37 ships under the extension-level directory name (android-37.0)
          # while the package is still addressed as android-37 on most channels.
          # Try both rather than hard-coding whichever this repo was built against.
          sdkmanager --install "platform-tools" "build-tools;37.0.0"
          sdkmanager --install "platforms;android-37" \
            || sdkmanager --install "platforms;android-37.0"
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools"

      - name: Accept SDK licences
        run: |
          # A non-interactive runner has accepted nothing, and a missing licence
          # makes the first build fail with a message that does not say so.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build, lint and test
        run: ./gradlew build --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
