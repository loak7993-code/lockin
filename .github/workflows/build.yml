name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: android-${{ runner.os }}-

      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "build-tools;37.0.0"
          # API 37 ships under the extension-level directory name (android-37.0)
          # while the package is still addressed as android-37 on most channels.
          # Try both rather than hard-coding whichever this repo was built against.
          sdkmanager --install "platforms;android-37" \
            || sdkmanager --install "platforms;android-37.0"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools"

      - name: Build, lint and test
        run: ./gradlew build --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lockin-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
